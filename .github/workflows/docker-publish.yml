name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'data/last-update.json']
  # The data-update bot commits with GITHUB_TOKEN, which does NOT trigger push
  # workflows — so without this the weekly medicine update never reached the image.
  workflow_run:
    workflows: ['Update Medicines Data']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Always the repo owner, not github.actor: for workflow_run / scheduled / bot-made
          # pushes the actor is someone else, and a PAT only works with its owner's name.
          username: ${{ github.repository_owner }}
          # CR_PAT if the secret exists (must be valid and have write:packages),
          # otherwise the built-in token (needs the package linked to this repo).
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bigbuud/apohouze:latest
            ghcr.io/bigbuud/apohouze:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
