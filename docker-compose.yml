services:
  apohouze:
    image: ghcr.io/bigbuud/apohouze:latest
    container_name: apohouze
    restart: unless-stopped
    # Same as before the update (root) so your existing database stays writable.
    # Optional hardening: `chown -R 1026:100 /volume1/docker/medicine`, then use "1026:100".
    user: "0:0"
    ports:
      - "3525:3000"
    volumes:
      - /volume1/docker/medicine:/data
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Brussels
      DB_PATH: /data/apohouze.db
      PORT: 3000
      NODE_ENV: production
      # No username/password/secret needed here: the account is created in the app on
      # first use (setup code in the container log) and two-step verification is mandatory.
      # Behind an HTTPS reverse proxy: TRUST_PROXY: 1
      # Locked out? Set RESET_ACCOUNT: "true" for ONE restart, then remove it again.

      # ── Country code ─────────────────────────────────────────────
      # West-Europe : BE NL DE FR ES IT CH AT LU
      # North-Europe: GB IE DK NO FI SE
      # East-Europe : PL CZ SK HU RO HR SI GR PT
      # North-America: US CA
      COUNTRY: BE
